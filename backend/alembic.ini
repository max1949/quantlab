# Alembic config (QuantLab AI)
# Run from backend/:  alembic revision --autogenerate -m "msg"  /  alembic upgrade head
# DB URL is injected from settings.database_url in migrations/env.py (do not hardcode here).
# NOTE: keep this file ASCII-only. Alembic reads the .ini with the OS *locale* encoding,
# which on a non-UTF-8 host (e.g. GBK on Windows) would fail to decode non-ASCII bytes.

[alembic]
script_location = migrations
prepend_sys_path = ..
path_separator = os

# sqlalchemy.url is injected by env.py from settings.database_url; leave empty.
sqlalchemy.url =

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
